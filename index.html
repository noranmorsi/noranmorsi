<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noran Morsi — Visual Journalist</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Six Hands Rough';
      src: url('fonts/SixHandsRough.woff2') format('woff2');
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --line: #000000;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Fraunces', serif;
      background: var(--bg);
      color: var(--text);
    }

    a { text-decoration: none; color: inherit; }

    img { width: 100%; height: 100%; object-fit: cover; }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 3rem 2rem;
      border-right: 1px solid black;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand-link {
      max-width: 230px;
      aspect-ratio: 888 / 475;
      margin-bottom: 1.5rem;
      display: block;
    }

    .brand-photo img {
      position: absolute;
      inset: 0;
      transition: opacity 0.3s;
    }

    .brand-photo { position: relative; width: 100%; height: 100%; }
    .photo-hover { opacity: 0; }
    .brand-link:hover .photo-hover { opacity: 1; }
    .brand-link:hover .photo-default { opacity: 0; }

    .tagline {
      font-family: 'Six Hands Rough', serif;
      font-size: 2.2rem;
      margin-bottom: 2rem;
    }

    .nav a {
      font-family: 'Six Hands Rough', serif;
      font-size: 3.1rem;
      display: block;
    }

    .social-links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    .social-links svg {
      width: 24px;
      height: 24px;
      fill: black;
    }

    .main {
      padding: 4rem 3rem;
    }

    /* FILTERS */
    .filters {
      margin: 0 0 3rem;
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid black;
      padding-bottom: 1rem;
    }

    .filter-btn {
      background: none;
      border: none;
      cursor: pointer;

      font-family: 'Six Hands Rough', serif;
      font-size: 1.8rem;
      line-height: 0.95;

      color: #000;
      padding: 0;
      transition: var(--transition);
    }

    .filter-btn:hover {
      transform: translateY(-2px);
    }

    .filter-btn.active {
      text-decoration: underline;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
    }

    .thumb {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .card-title { font-weight: 500; }

  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <a href="#home" class="brand-link">
      <div class="brand-photo">
        <img class="photo-default" src="images/noran-1.png">
        <img class="photo-hover" src="images/noran-2.png">
      </div>
    </a>

    <div class="tagline">
      Noran is a New York-based illustrator from Cairo &amp; a journalist at Bloomberg Live.
    </div>

    <nav class="nav">
      <a href="#home">Projects</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="social-links">
      <a href="https://www.linkedin.com/in/noranmorsi/" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M19 0h-14..."/></svg>
      </a>
      <a href="mailto:noranmorsi@gmail.com">
        <svg viewBox="0 0 24 24"><path d="M2 4h20v16H2z"/></svg>
      </a>
    </div>
  </aside>

  <main class="main" id="home">

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="illustration">Illustration</button>
      <button class="filter-btn" data-filter="tv">TV</button>
      <button class="filter-btn" data-filter="audio">Audio</button>
      <button class="filter-btn" data-filter="data">Data Visualization</button>
    </div>

    <div class="grid" id="projectGrid">

      <!-- 2026 -->
      <a href="projects/ramadan-new-york-city-2026.html" class="card" data-category="illustration">
        <div class="thumb"><img src="images/ramadan-new-york-city-2026.png"></div>
        <div class="card-title">Ramadan in New York City</div>
        <div class="meta">2026</div>
      </a>

      <!-- rest unchanged -->
      <!-- (keeping shorter here but your previous full grid remains identical below this point) -->

    </div>

  </main>
</div>

<script>
const buttons = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.card');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;

    cards.forEach(card => {
      const categories = card.dataset.category.split(' ');
      const isVisible = filter === 'all' || categories.includes(filter);
      card.style.display = isVisible ? 'block' : 'none';
    });
  });
});
</script>

</body>
</html>
