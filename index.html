<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noran Morsi — Visual Journalist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

  <style>
    /* --- Custom Font --- */
    @font-face {
      font-family: 'Six Hands Rough';
      src: url('fonts/SixHandsRough.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #ffffff;
      --text: #2d211c;
      --muted: #7d675d;
      --line: #dfcdbb;
      --berry: #8f5873;
      --rose: #c97b7b;
      --sky: #92aecd;
      --sage: #8ca38f;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Fraunces', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      padding: 3rem 2rem;
      border-right: 1px solid var(--line);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- NEW BRAND IMAGE --- */
    .brand-link {
      display: block;
      width: 140px;
      height: 140px;
      margin-bottom: 1.25rem;
    }

    .brand-photo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
    }

    .brand-photo img {
      position: absolute;
      inset: 0;
      transition: opacity 0.3s ease;
    }

    .photo-hover {
      opacity: 0;
    }

    .brand-link:hover .photo-hover {
      opacity: 1;
    }

    .brand-link:hover .photo-default {
      opacity: 0;
    }

    /* --- TAGLINE --- */
    .tagline {
      font-family: 'Six Hands Rough', 'Fraunces', serif;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.35;
      margin: 0 0 2rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav a {
      font-size: 1.1rem;
      color: var(--muted);
    }

    .nav a:hover {
      color: var(--berry);
      transform: translateX(4px);
    }

    .main {
      padding: 4rem 3rem;
      max-width: 1200px;
    }

    .hero {
      margin-bottom: 4rem;
    }

    .hero h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 0 0 1rem;
      line-height: 1.2;
      font-weight: 500;
      max-width: 800px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 600px;
    }

    .filters {
      margin-bottom: 3rem;
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      font-size: 1rem;
    }

    .filter-btn.active {
      color: var(--text);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
    }

    .thumb {
      border-radius: 12px;
      overflow: hidden;
      background: #e5ddd5;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 500;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .about {
      margin-top: 6rem;
      padding-top: 4rem;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 4rem;
    }

    .portrait {
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 3/4;
    }

    .contact {
      margin-top: 6rem;
      padding: 4rem;
      background: rgba(143, 88, 115, 0.05);
      border-radius: 30px;
      text-align: center;
    }

    .email {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 1rem 2.5rem;
      background: var(--berry);
      color: white;
      border-radius: 999px;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: relative; border-right: none; }
      .nav { flex-direction: row; }
      .about { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">

      <div class="brand">
        <a href="#home" class="brand-link">
          <div class="brand-photo">
            <img class="photo-default" src="images/noran-1.png" alt="Noran">
            <img class="photo-hover" src="images/noran-2.png" alt="Noran alt">
          </div>
        </a>

        <p class="tagline">
          Noran is a New York-based illustrator from Cairo &amp; a journalist at Bloomberg Live.
        </p>
      </div>

      <nav class="nav">
        <a href="#home">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </aside>

    <main class="main">
      <!-- rest unchanged -->
    </main>
  </div>
</body>
</html>
