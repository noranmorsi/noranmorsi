<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact — Noran Morsi</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Six Hands Rough';
      src: url('fonts/SixHandsRough.woff2') format('woff2');
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --line: #000000;
      --click-green: #1f5f3a;
      --selected-green: #2f6f4f;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Fraunces', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    a:hover,
    a:active {
      color: var(--click-green);
    }

    img {
      width: 100%;
      display: block;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 2.25rem 1.5rem;
      border-right: 1px solid black;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand-link {
      max-width: 230px;
      aspect-ratio: 888 / 475;
      margin-bottom: 1.5rem;
      display: block;
    }

    .brand-photo {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .brand-photo img {
      position: absolute;
      inset: 0;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s;
    }

    .photo-hover { opacity: 0; }
    .brand-link:hover .photo-hover { opacity: 1; }
    .brand-link:hover .photo-default { opacity: 0; }

    .tagline {
      font-family: 'Six Hands Rough', serif;
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 2rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav a {
      font-family: 'Six Hands Rough', serif;
      font-size: 3.1rem;
      line-height: 1;
      display: block;
    }

    .nav a.active {
      color: var(--selected-green);
    }

    .social-links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-links a {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .social-links svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: block;
    }

    .main {
      padding: 2.5rem 2.25rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .contact-wrap {
      width: 100%;
      max-width: 760px;
      border-top: 1px solid black;
      border-bottom: 1px solid black;
      padding: 2.5rem 0;
    }

    h1 {
      font-family: 'Six Hands Rough', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.9;
      color: var(--selected-green);
      margin: 0 0 2rem;
    }

    .contact-intro {
      font-size: 1.25rem;
      margin: 0 0 2.5rem;
      max-width: 620px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input,
    textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid black;
      padding: 0.6rem 0;
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      background: transparent;
      color: black;
      outline: none;
      border-radius: 0;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-bottom-color: var(--selected-green);
    }

    button {
      align-self: flex-start;
      background: white;
      color: black;
      border: 1px solid black;
      padding: 0.85rem 2rem;
      cursor: pointer;
      font-family: 'Six Hands Rough', serif;
      font-size: 2rem;
      line-height: 1;
      transition: var(--transition);
    }

    button:hover {
      background: black;
      color: white;
    }

    .form-note {
      font-size: 0.9rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid black;
      }

      .nav {
        flex-direction: row;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .nav a {
        font-size: 2.2rem;
      }

      .main {
        padding: 2rem 1.5rem;
        display: block;
      }
    }
  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <a href="/" class="brand-link">
      <div class="brand-photo">
        <img class="photo-default" src="images/noran-1.png" alt="Noran Morsi">
        <img class="photo-hover" src="images/noran-2.png" alt="Noran Morsi alternate portrait">
      </div>
    </a>

    <div class="tagline">
      Noran is a New York-based illustrator from Cairo &amp; a journalist at Bloomberg Live.
    </div>

    <nav class="nav">
      <a href="/">Projects</a>
      <a href="about">About</a>
      <a href="contact" class="active">Contact</a>
    </nav>

    <div class="social-links">
      <a href="https://www.linkedin.com/in/noranmorsi/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.95v5.66H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
        </svg>
      </a>

      <a href="mailto:noranmorsi@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 4h20c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H2c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm10 9 10-6.25V6L12 12.25 2 6v.75L12 13zm0 2L2 8.75V18h20V8.75L12 15z"/>
        </svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <section class="contact-wrap">
      <h1>Contact</h1>

      <p class="contact-intro">
        For commissions, collaborations, editorial work, or production inquiries, send me a note below.
      </p>

      <form action="https://formspree.io/f/mzdoveyr" method="POST">
        <div>
          <label for="name">Name</label>
          <input id="name" type="text" name="name" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Send</button>
      </form>

      <p class="form-note">
        You can also email me directly at <a href="mailto:noranmorsi@gmail.com">noranmorsi@gmail.com</a>.
      </p>
    </section>
  </main>

</div>
</body>
</html>
