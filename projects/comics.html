<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Comics — Noran Morsi</title>

  <link rel="icon" type="image/png" href="../favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Six Hands Rough';
      src: url('../fonts/SixHandsRough.woff2') format('woff2');
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --line: #000000;
      --click-green: #1f5f3a;
      --selected-green: #2f6f4f;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Fraunces', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    a:active {
      color: var(--click-green);
    }

    a.clicked-link {
      color: var(--selected-green);
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 2.25rem 1.5rem;
      border-right: 1px solid black;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand-link {
      max-width: 230px;
      aspect-ratio: 888 / 475;
      margin-bottom: 1.5rem;
      display: block;
    }

    .brand-photo {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .brand-photo img {
      position: absolute;
      inset: 0;
      height: 100%;
      transition: opacity 0.3s;
    }

    .photo-hover {
      opacity: 0;
    }

    .brand-link:hover .photo-hover {
      opacity: 1;
    }

    .brand-link:hover .photo-default {
      opacity: 0;
    }

    .tagline {
      font-family: 'Six Hands Rough', serif;
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 2rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav a {
      font-family: 'Six Hands Rough', serif;
      font-size: 3.1rem;
      line-height: 1;
      display: block;
    }

    .social-links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-links a {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .social-links svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: block;
    }

    .main {
      padding: 2.5rem 2.25rem;
      max-width: 1200px;
    }

    .back-link {
      font-family: 'Six Hands Rough', serif;
      font-size: 1.8rem;
      line-height: 1;
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--selected-green);
    }

    .project-header {
      border-bottom: 1px solid black;
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    .project-title {
      font-size: clamp(2.6rem, 6vw, 5.5rem);
      line-height: 0.95;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
    }

    .project-meta {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    .project-description {
      font-size: 1.25rem;
      max-width: 760px;
      margin: 0;
    }

    .project-section {
      margin: 2.5rem 0;
    }

    .project-section p {
      max-width: 760px;
      font-size: 1.1rem;
    }

    .image-full {
      margin: 1.5rem 0;
    }

    .image-full img {
      height: auto;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.35rem;
      margin: 1.5rem 0;
    }

    .image-grid img {
      aspect-ratio: 4 / 3;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      font-size: 0.85rem;
      margin-top: 0.4rem;
    }

    .you-may-like {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid black;
    }

    .you-may-like h2 {
      font-family: 'Six Hands Rough', serif;
      font-size: 3rem;
      line-height: 1;
      margin: 0 0 1.5rem;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.35rem;
    }
.book {
  max-width: 900px;
  margin: auto;
  text-align: center;
}

.page img {
  width: 100%;
  border-radius: 10px;
  display: block;
}

.page-number {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.6;
}

.book button {
  margin: 10px;
  padding: 8px 12px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}
    .related-card {
      position: relative;
      overflow: hidden;
      display: block;
      aspect-ratio: 4 / 3;
      background: #f2f2f2;
    }

    .related-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .related-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: var(--transition);
      z-index: 1;
    }

    .related-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: var(--transition);
      z-index: 2;
      pointer-events: none;
    }

    .related-box {
      background: #ffffff;
      color: #000000;
      padding: 0.75rem 1.25rem;
      text-align: center;
      max-width: 80%;
    }

    .related-box h3 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.15;
    }

    .related-box p {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .related-card:hover::after,
    .related-card:hover .related-overlay {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid black;
      }

      .nav {
        display: flex;
        flex-direction: row;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .nav a {
        font-size: 2.2rem;
      }

      .main {
        padding: 2rem 1.5rem;
      }

      .image-grid,
      .related-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <a href="../index.html#home" class="brand-link">
      <div class="brand-photo">
        <img class="photo-default" src="../images/noran-1.png" alt="Noran Morsi">
        <img class="photo-hover" src="../images/noran-2.png" alt="Noran Morsi alternate portrait">
      </div>
    </a>

    <div class="tagline">
      Noran is a New York-based illustrator from Cairo &amp; a journalist at Bloomberg Live.
    </div>

    <nav class="nav">
      <a href="../index.html#home">Projects</a>
      <a href="../index.html#about">About</a>
      <a href="../index.html#contact">Contact</a>
    </nav>

    <div class="social-links">
      <a href="https://www.linkedin.com/in/noranmorsi/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.95v5.66H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
        </svg>
      </a>

      <a href="mailto:noranmorsi@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 4h20c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H2c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm10 9 10-6.25V6L12 12.25 2 6v.75L12 13zm0 2L2 8.75V18h20V8.75L12 15z"/>
        </svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <a href="../index.html#home" class="back-link">← Back to projects</a>

    <header class="project-header">
      <h1 class="project-title">Comics</h1>

      <div class="project-meta">
        Illustration • 2024
      </div>

      <p class="project-description">
      General comics I've illustrated over the years.
      </p>
    </header>

    <section class="project-section">
    <div class="book">
  <button onclick="prevPage()">‹ Prev</button>

  <div class="page">
    <img id="pageImage" />
    <div class="page-number" id="pageNumber"></div>
  </div>

  <button onclick="nextPage()">Next ›</button>
</div>

    
    </section>

  

  <section class="you-may-like">
  <h2>You may also like</h2>

  <div class="related-grid">
    <a href="atlas-obscura.html" class="related-card">
      <img src="../images/atlas-obscura.png" alt="Atlas Obscura">
      <div class="related-overlay">
        <div class="related-box">
          <h3>Atlas Obscura</h3>
          <p>2024</p>
        </div>
      </div>
    </a>

    <a href="center-for-arab-narratives.html" class="related-card">
      <img src="../images/center-for-arab-narratives.png" alt="Center for Arab Narratives">
      <div class="related-overlay">
        <div class="related-box">
          <h3>Center for Arab Narratives</h3>
          <p>2024</p>
        </div>
      </div>
    </a>
  </div>
</section>
  </main>
</div>

<script>
const links = document.querySelectorAll('a');

links.forEach(link => {
  link.addEventListener('click', () => {
    links.forEach(l => l.classList.remove('clicked-link'));
    link.classList.add('clicked-link');
  });
});
  const pages = [
  ".../images/comics/1.png",
  "../images/comics/2.png",
  "../images/comics/3.png",
  "../images/comics/4.png",
    "../images/comics/5.png"
];

let currentPage = 0;

function renderPage() {
  document.getElementById("pageImage").src = pages[currentPage];
  document.getElementById("pageNumber").innerText =
    `Page ${currentPage + 1} / ${pages.length}`;
}

function nextPage() {
  if (currentPage < pages.length - 1) currentPage++;
  renderPage();
}

function prevPage() {
  if (currentPage > 0) currentPage--;
  renderPage();
}

renderPage();
</script>

</body>
</html>
